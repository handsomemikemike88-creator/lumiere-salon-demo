# TEST/DEMO deployment behind the Hostinger VPS template's Traefik (host network, entrypoint websecure, certresolver letsencrypt).
# Secrets come from the project environment (Hostinger Docker Manager), never from this repo.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: salon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon -d salon"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      TRUST_PROXY: "1"
      DATABASE_URL: postgres://salon:${POSTGRES_PASSWORD}@db:5432/salon
      DATABASE_SSL: "off"
      PUBLIC_BASE_URL: https://${SITE_HOST}
      APP_SECRET: ${APP_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SITE_DEMO_MODE: "true"
      SEED_DEMO_DATA: "true"
      STRIPE_MODE: test
      NOTIFY_ENABLED: "false"
      EMAIL_PROVIDER: none
    expose:
      - "3000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.salon.rule=Host(`${SITE_HOST}`)
      - traefik.http.routers.salon.entrypoints=websecure
      - traefik.http.routers.salon.tls.certresolver=letsencrypt
      - traefik.http.services.salon.loadbalancer.server.port=3000
      - traefik.http.routers.salon-alt.rule=Host(`www.${SITE_HOST}`) || Host(`${OLD_HOST}`)
      - traefik.http.routers.salon-alt.entrypoints=websecure
      - traefik.http.routers.salon-alt.tls.certresolver=letsencrypt
      - traefik.http.routers.salon-alt.middlewares=salon-toapex
      - traefik.http.routers.salon-alt.service=salon
      - traefik.http.middlewares.salon-toapex.redirectregex.regex=^https://[^/]+/?(.*)
      - traefik.http.middlewares.salon-toapex.redirectregex.replacement=https://${SITE_HOST}/$${1}
      - traefik.http.middlewares.salon-toapex.redirectregex.permanent=false
  backup:
    # Daily pg_dump (custom format) into the named volume `salon-backups`.
    # One dump at container start, then every day at 03:00 Hong Kong / Shanghai time (UTC+8). Keeps 14 days.
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: salon
      PGDATABASE: salon
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: HKT-8
      BACKUP_HOUR: "03"
      KEEP_DAYS: "14"
    volumes:
      - salon-backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -u
        umask 077
        mkdir -p /backups
        dump() {
          f="/backups/salon-$$(date +%Y%m%d-%H%M%S).dump"
          if pg_dump -Fc -f "$$f.tmp" && pg_restore -l "$$f.tmp" >/dev/null; then
            mv "$$f.tmp" "$$f"
            echo "$$(date '+%F %T %Z') backup OK: $$f ($$(du -h "$$f" | cut -f1))"
          else
            rm -f "$$f.tmp"
            echo "$$(date '+%F %T %Z') backup FAILED" >&2
          fi
          find /backups -name 'salon-*.dump' -type f -mtime +$$((KEEP_DAYS - 1)) -print -delete
          echo "backups kept: $$(ls /backups | grep -c '^salon-.*\.dump$$')"
        }
        until pg_isready -q; do sleep 2; done
        echo "backup service started; daily at $${BACKUP_HOUR}:00 UTC+8, keep $${KEEP_DAYS} days"
        dump
        while true; do
          now=$$(date +%s)
          next=$$(date -d "$$(date +%Y-%m-%d) $${BACKUP_HOUR}:00:00" +%s)
          [ "$$next" -le "$$now" ] && next=$$((next + 86400))
          echo "next backup in $$((next - now))s"
          sleep $$((next - now))
          dump
        done
volumes:
  pgdata:
  salon-backups:
