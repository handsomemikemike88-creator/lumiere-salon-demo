# Render Blueprint: web service + managed PostgreSQL. In Render: New > Blueprint > pick this repo.
# Secrets marked sync:false are entered in the Render dashboard; they are NOT stored in this file.
databases:
  - name: salon-db
    plan: basic-256mb
    region: singapore
services:
  - type: web
    name: salon-app
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase: { name: salon-db, property: connectionString }
      - key: DATABASE_SSL
        value: require
      - key: APP_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false          # e.g. https://salon.example.com (your custom domain, or https://<name>.onrender.com)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STORE_NAME
        sync: false
      - key: STORE_ADDRESS
        sync: false
      - key: STORE_PHONE
        sync: false
      - key: STORE_WHATSAPP
        sync: false
      - key: STORE_HOURS
        sync: false
      - key: BUSINESS_REG_NO
        sync: false
      - key: STRIPE_MODE
        value: test
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
